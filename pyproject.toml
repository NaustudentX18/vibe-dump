[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-dump"
version = "0.2.0"
description = "Pocket AI spec goblin for turning voice dumps into build-ready software blueprints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["fastapi>=0.118", "uvicorn>=0.30"]
# Pydantic AI + Graph + Instructor for the M9.5 openlaude runtime.
# Optional so the inline tool-use loop remains the always-on fallback.
agent = [
    "pydantic-ai>=1.0",
    "pydantic-graph>=1.0",
    "instructor>=1.0",
]
all = ["vibe-dump[web,dev,agent]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
