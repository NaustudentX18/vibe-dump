[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-dump"
version = "0.1.0"
description = "Pocket AI spec goblin for turning voice dumps into build-ready software blueprints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["fastapi>=0.111", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
