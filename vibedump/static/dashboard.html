<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Vibe-Dump · Pocket Spec Goblin</title>
  <style>
    :root {
      --bg-base: #0b0f1a;
      --bg-elev-1: #121829;
      --bg-elev-2: #1a2240;
      --bg-glass: rgba(26, 34, 64, 0.55);
      --text-primary: oklch(96% 0.02 260);
      --text-secondary: oklch(72% 0.04 260);
      --text-muted: oklch(54% 0.04 260);
      --accent-cyan: #4ad6ff;
      --accent-violet: #a07cff;
      --accent-poo: #b78a3a;
      --accent-good: #58e0a4;
      --accent-warn: #ffb45c;
      --accent-bad: #ff647c;
      --border-subtle: rgba(160, 124, 255, 0.18);
      --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      --radius-card: 18px;
      --radius-pill: 999px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --duration-fast: 150ms;
      --duration-normal: 280ms;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1200px 800px at 80% -10%, rgba(160, 124, 255, 0.18), transparent 60%),
        radial-gradient(900px 700px at -10% 110%, rgba(74, 214, 255, 0.12), transparent 60%),
        var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: var(--accent-cyan); text-decoration: none; }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }
    code, pre {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85em;
    }
    pre {
      background: var(--bg-elev-1);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: var(--space-3);
      overflow: auto;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      padding-top: calc(env(safe-area-inset-top, 0) + var(--space-3));
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .icon-btn {
      width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 12px;
      color: var(--text-primary);
      transition: background var(--duration-fast) var(--ease-out-expo),
                  transform var(--duration-fast) var(--ease-out-expo);
    }
    .icon-btn:hover, .icon-btn:focus-visible {
      background: var(--bg-elev-2);
      transform: translateY(-1px);
      outline: none;
    }
    .icon-btn:active { transform: translateY(0); }
    .app-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex: 1;
    }
    .app-title .mascot-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent-poo);
      box-shadow: 0 0 12px var(--accent-poo);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }
    .level-pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      color: #0a0c14;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* Drawers */
    .scrim {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--duration-normal) var(--ease-out-expo);
      z-index: 30;
    }
    .scrim.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer {
      position: fixed;
      top: 0; bottom: 0;
      width: min(320px, 86vw);
      background: var(--bg-elev-1);
      border-right: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-glass);
      transform: translateX(-100%);
      transition: transform var(--duration-normal) var(--ease-out-expo);
      z-index: 31;
      padding: var(--space-5);
      padding-top: calc(env(safe-area-inset-top, 0) + var(--space-5));
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      overflow-y: auto;
    }
    .drawer.is-open { transform: translateX(0); }
    .drawer.right {
      left: auto;
      right: 0;
      border-right: none;
      border-left: 1px solid var(--border-subtle);
      transform: translateX(100%);
    }
    .drawer.right.is-open { transform: translateX(0); }
    .drawer h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin: var(--space-3) 0 var(--space-1);
    }
    .nav-link {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-3) var(--space-3);
      border-radius: 12px;
      color: var(--text-primary);
      font-weight: 500;
      transition: background var(--duration-fast) var(--ease-out-expo);
    }
    .nav-link:hover, .nav-link.is-active {
      background: var(--bg-elev-2);
    }

    /* Main layout */
    .app-main {
      max-width: 980px;
      margin: 0 auto;
      padding: var(--space-4);
      padding-bottom: calc(env(safe-area-inset-bottom, 0) + 96px);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    /* Mascot panel */
    .mascot-panel {
      position: relative;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: var(--space-5);
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
      box-shadow: var(--shadow-glass);
    }
    @media (min-width: 720px) {
      .mascot-panel {
        grid-template-columns: 120px 1fr auto;
        align-items: center;
      }
    }
    .mascot {
      width: 96px; height: 96px;
      margin: 0 auto;
      position: relative;
    }
    .mascot .body {
      position: absolute; inset: 8px;
      background: radial-gradient(circle at 35% 30%, #d6a85e 0%, #b78a3a 60%, #7d5a1d 100%);
      border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
      box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.35), 0 4px 16px rgba(183, 138, 58, 0.35);
    }
    .mascot .eye {
      position: absolute;
      width: 12px; height: 14px;
      background: #fff;
      border-radius: 50%;
      top: 36px;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15);
    }
    .mascot .eye.left  { left: 32px; }
    .mascot .eye.right { right: 32px; }
    .mascot .pupil {
      position: absolute;
      width: 6px; height: 6px;
      background: #0a0c14;
      border-radius: 50%;
      top: 4px; left: 3px;
    }
    .mascot .mouth {
      position: absolute;
      left: 50%; top: 60px;
      transform: translateX(-50%);
      width: 22px; height: 10px;
      background: #4a2a10;
      border-radius: 0 0 12px 12px;
    }
    .mascot.is-listening .body { animation: bounce 1.1s ease-in-out infinite; }
    .mascot.is-thinking  .body { animation: squish 0.6s ease-in-out infinite; }
    .mascot.is-speaking  .mouth { animation: speak 0.4s ease-in-out infinite; }
    .mascot.is-error .eye { background: var(--accent-bad); }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes squish {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.06, 0.94); }
    }
    @keyframes speak {
      0%, 100% { transform: translateX(-50%) scaleY(0.6); }
      50% { transform: translateX(-50%) scaleY(1.2); }
    }
    .mascot-meta { min-width: 0; }
    .mascot-meta h1 {
      font-size: 1.35rem;
      margin: 0 0 var(--space-1);
      letter-spacing: -0.01em;
    }
    .mascot-meta p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.92rem;
    }
    .status-chip {
      align-self: start;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--bg-elev-2);
      color: var(--text-secondary);
    }
    .status-chip[data-state="listening"] { background: rgba(74, 214, 255, 0.18); color: var(--accent-cyan); }
    .status-chip[data-state="thinking"]  { background: rgba(160, 124, 255, 0.18); color: var(--accent-violet); }
    .status-chip[data-state="speaking"]  { background: rgba(88, 224, 164, 0.18); color: var(--accent-good); }
    .status-chip[data-state="error"]     { background: rgba(255, 100, 124, 0.18); color: var(--accent-bad); }

    /* Search bar */
    .search-bar {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .search-bar input {
      flex: 1;
      background: var(--bg-elev-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 12px 18px 12px 42px;
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: border-color var(--duration-fast) var(--ease-out-expo),
                  box-shadow var(--duration-fast) var(--ease-out-expo);
    }
    .search-bar input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(74, 214, 255, 0.18);
    }
    .search-bar::before {
      content: "🔍";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 0.7;
    }

    /* Dumps list + detail (responsive split) */
    .split {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
    }
    @media (min-width: 900px) {
      .split {
        grid-template-columns: 320px 1fr;
        align-items: start;
      }
    }
    .card {
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: var(--space-4);
      box-shadow: var(--shadow-glass);
    }
    .card h2 {
      margin: 0 0 var(--space-3);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }
    .dump-list {
      display: flex; flex-direction: column;
      gap: var(--space-2);
      max-height: 60vh;
      overflow-y: auto;
    }
    .dump-item {
      text-align: left;
      width: 100%;
      background: var(--bg-elev-1);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: var(--space-3);
      cursor: pointer;
      transition: border-color var(--duration-fast) var(--ease-out-expo),
                  transform var(--duration-fast) var(--ease-out-expo);
    }
    .dump-item:hover, .dump-item:focus-visible {
      border-color: var(--accent-cyan);
      transform: translateX(2px);
      outline: none;
    }
    .dump-item.is-active {
      border-color: var(--accent-violet);
      background: var(--bg-elev-2);
    }
    .dump-item .title { font-weight: 600; font-size: 0.95rem; }
    .dump-item .meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex; gap: 8px;
    }
    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-elev-2);
      color: var(--text-secondary);
      text-transform: lowercase;
    }
    .badge[data-status="draft"]     { color: var(--text-secondary); }
    .badge[data-status="listening"] { background: rgba(74, 214, 255, 0.18); color: var(--accent-cyan); }
    .badge[data-status="thinking"]  { background: rgba(160, 124, 255, 0.18); color: var(--accent-violet); }
    .badge[data-status="speaking"]  { background: rgba(88, 224, 164, 0.18); color: var(--accent-good); }
    .badge[data-status="error"]     { background: rgba(255, 100, 124, 0.18); color: var(--accent-bad); }
    .empty {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      padding: var(--space-5);
    }
    .transcript-list, .blueprint-view {
      display: flex; flex-direction: column;
      gap: var(--space-3);
    }
    .turn {
      padding: var(--space-3);
      border-radius: 12px;
      max-width: 92%;
    }
    .turn.user      { background: var(--bg-elev-1); align-self: flex-start; }
    .turn.assistant { background: var(--bg-elev-2); align-self: flex-end; border: 1px solid var(--border-subtle); }
    .turn .role {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .blueprint-view pre { white-space: pre-wrap; word-break: break-word; }
    .blueprint-view h3 { margin: 0 0 var(--space-2); font-size: 1rem; }
    .row-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
    .btn {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      background: var(--bg-elev-2);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border-subtle);
      transition: background var(--duration-fast) var(--ease-out-expo),
                  transform var(--duration-fast) var(--ease-out-expo);
    }
    .btn:hover { background: var(--accent-violet); border-color: var(--accent-violet); transform: translateY(-1px); }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      color: #0a0c14;
      font-weight: 700;
      border: none;
    }
    .btn.primary:hover { filter: brightness(1.08); }

    /* Bottom action bar */
    .action-bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0) + 16px);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 8px 12px;
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-glass);
      z-index: 25;
    }
    .action-bar .btn { padding: 10px 14px; font-size: 0.85rem; }
    .action-bar .record-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-bad), var(--accent-violet));
      color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 6px 18px rgba(255, 100, 124, 0.35);
      transition: transform var(--duration-fast) var(--ease-out-expo);
    }
    .action-bar .record-btn.is-recording { animation: pulse-strong 1.2s ease-in-out infinite; }
    @keyframes pulse-strong {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Toast / SSE log */
    .event-log {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0) + 96px);
      right: 16px;
      max-width: 280px;
      display: flex; flex-direction: column;
      gap: 6px;
      z-index: 22;
      pointer-events: none;
    }
    .toast {
      background: var(--bg-elev-2);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      box-shadow: var(--shadow-glass);
      animation: slide-in var(--duration-normal) var(--ease-out-expo);
    }
    @keyframes slide-in {
      from { transform: translateX(40px); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    /* Form rows for settings */
    .field {
      display: flex; flex-direction: column;
      gap: 6px;
      margin-bottom: var(--space-3);
    }
    .field label {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .field input, .field select, .field textarea {
      background: var(--bg-elev-1);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .field input:focus { outline: none; border-color: var(--accent-cyan); }
    .check { display: flex; align-items: center; gap: 8px; }
    .health-list { display: flex; flex-direction: column; gap: 6px; }
    .health-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--bg-elev-1);
    }
    .health-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-good);
    }
    .health-row[data-ok="false"] .health-dot { background: var(--accent-bad); }
  </style>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <div class="app-title">
      <span class="mascot-dot" aria-hidden="true"></span>
      Vibe-Dump
    </div>
    <span class="level-pill" id="levelPill">Lvl 1</span>
    <button class="icon-btn" id="settingsBtn" aria-label="Open settings">⚙</button>
  </header>

  <div class="scrim" id="scrim"></div>

  <nav class="drawer" id="drawer" aria-label="Main">
    <h2>Workspace</h2>
    <a class="nav-link is-active" href="#dumps">📚 Dumps</a>
    <a class="nav-link" href="#search">🔍 Search</a>
    <a class="nav-link" href="#providers">🔌 Providers</a>
    <a class="nav-link" href="#sync">☁️ Sync</a>
    <h2>Stats</h2>
    <div class="health-row"><span class="health-dot"></span><span id="navHealth">No providers yet</span></div>
    <h2>Shortcuts</h2>
    <div class="health-row"><span>·</span><span>Hold 🎙 to record</span></div>
    <div class="health-row"><span>·</span><span>Swipe ←/→ for nav</span></div>
  </nav>

  <aside class="drawer right" id="settingsDrawer" aria-label="Settings">
    <h2>New Dump</h2>
    <form id="newDumpForm" class="field">
      <label for="newTitle">Title</label>
      <input id="newTitle" required maxlength="200" placeholder="Pocket Manus for builders" />
      <label for="newAudio">Audio path (optional)</label>
      <input id="newAudio" placeholder="dumps/latest.wav" />
      <button class="btn primary" type="submit">Create dump</button>
    </form>
    <h2>Providers</h2>
    <form id="providerForm" class="field">
      <label for="provName">Name</label>
      <input id="provName" required placeholder="openrouter" />
      <label for="provKind">Kind</label>
      <select id="provKind">
        <option value="stt">STT</option>
        <option value="llm" selected>LLM</option>
        <option value="tts">TTS</option>
      </select>
      <div class="check">
        <input type="checkbox" id="provEnabled" checked />
        <label for="provEnabled">Enabled</label>
      </div>
      <label for="provConfig">Config JSON</label>
      <textarea id="provConfig" rows="3" placeholder='{"model":"x","api_key":"..."}'></textarea>
      <button class="btn" type="submit">Save provider</button>
    </form>
    <div class="health-list" id="healthList"></div>
  </aside>

  <main class="app-main">
    <section class="mascot-panel" aria-labelledby="mascotHeading">
      <div class="mascot" id="mascot" data-state="idle">
        <div class="body"></div>
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="mascot-meta">
        <h1 id="mascotHeading">Hi, I'm Dumpi 👋</h1>
        <p id="mascotLine">Tap record to dump your next messy idea.</p>
      </div>
      <span class="status-chip" id="statusChip" data-state="idle">Idle</span>
    </section>

    <div class="search-bar">
      <input id="searchInput" type="search" placeholder="Search RAG memory…" />
    </div>

    <section class="split" id="dumpsView">
      <div class="card" aria-labelledby="dumpsHeading">
        <h2 id="dumpsHeading">📚 Dumps</h2>
        <div class="dump-list" id="dumpList"></div>
      </div>
      <div class="card" aria-labelledby="detailHeading">
        <h2 id="detailHeading">💎 Selected dump</h2>
        <div id="dumpDetail" class="empty">Pick a dump to see transcript + blueprint.</div>
      </div>
    </section>
  </main>

  <div class="action-bar" role="toolbar" aria-label="Quick actions">
    <button class="btn" id="navSearchBtn" aria-label="Search">🔍</button>
    <button class="record-btn" id="recordBtn" aria-label="Record">🎙</button>
    <button class="btn" id="navSettingsBtn" aria-label="Settings">⚙️</button>
  </div>

  <div class="event-log" id="eventLog" aria-live="polite"></div>

  <script>
    "use strict";

    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    const state = {
      dumps: [],
      selectedId: null,
      recording: false,
      busSource: null,
    };

    const API = {
      health: "/api/health",
      dumps: "/api/dumps",
      dump: (id) => `/api/dumps/${id}`,
      turns: (id) => `/api/dumps/${id}/turns`,
      blueprint: (id) => `/api/dumps/${id}/blueprint`,
      ingestFake: (id) => `/api/dumps/${id}/ingest-fake`,
      status: (id) => `/api/dumps/${id}/status`,
      search: "/api/search",
      providers: "/api/providers",
      events: "/api/events",
    };

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { "content-type": "application/json" },
        ...opts,
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`${res.status} ${text || res.statusText}`);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    function setMascotState(s) {
      const mascot = $("#mascot");
      const chip = $("#statusChip");
      const line = $("#mascotLine");
      mascot.dataset.state = s;
      chip.dataset.state = s;
      chip.textContent = s.charAt(0).toUpperCase() + s.slice(1);
      const lines = {
        idle:      "Tap record to dump your next messy idea.",
        listening: "I'm listening… keep going.",
        thinking:  "Cooking up a spec…",
        speaking:  "Here's what I heard.",
        error:     "Oof, something broke. Check the log.",
        level_up:  "Level up! 🎉",
        sleeping:  "Zzz…",
      };
      line.textContent = lines[s] || "";
    }

    function showToast(text) {
      const log = $("#eventLog");
      const t = document.createElement("div");
      t.className = "toast";
      t.textContent = text;
      log.appendChild(t);
      setTimeout(() => t.remove(), 5000);
    }

    function renderDumps() {
      const list = $("#dumpList");
      list.innerHTML = "";
      if (state.dumps.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No dumps yet. Tap the mic to start.";
        list.appendChild(empty);
        return;
      }
      for (const dump of state.dumps) {
        const btn = document.createElement("button");
        btn.className = "dump-item" + (dump.id === state.selectedId ? " is-active" : "");
        btn.type = "button";
        btn.innerHTML = `
          <div class="title"></div>
          <div class="meta">
            <span class="badge" data-status=""></span>
            <span class="ts"></span>
          </div>`;
        btn.querySelector(".title").textContent = dump.title;
        const badge = btn.querySelector(".badge");
        badge.dataset.status = dump.status;
        badge.textContent = dump.status;
        btn.querySelector(".ts").textContent = new Date(dump.created_at + "Z").toLocaleString();
        btn.addEventListener("click", () => selectDump(dump.id));
        list.appendChild(btn);
      }
    }

    async function loadDumps() {
      const data = await api(API.dumps);
      state.dumps = data.items;
      renderDumps();
    }

    async function selectDump(id) {
      state.selectedId = id;
      renderDumps();
      const detail = $("#dumpDetail");
      detail.classList.remove("empty");
      detail.innerHTML = `<div class="empty">Loading dump ${id}…</div>`;
      try {
        const [turnsRes, blueprintRes] = await Promise.all([
          api(API.turns(id)),
          api(API.blueprint(id)).catch((e) => ({ error: e.message })),
        ]);
        renderDumpDetail(detail, turnsRes, blueprintRes);
      } catch (e) {
        detail.innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
      }
    }

    function renderDumpDetail(root, turnsRes, blueprintRes) {
      root.innerHTML = "";
      const transcript = document.createElement("div");
      transcript.className = "transcript-list";
      const transcriptHeading = document.createElement("h3");
      transcriptHeading.textContent = "🗣 Transcript";
      root.appendChild(transcriptHeading);
      root.appendChild(transcript);
      if (!turnsRes.items || turnsRes.items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No turns yet. Tap ingest-fake to add a sample turn.";
        transcript.appendChild(empty);
      } else {
        for (const t of turnsRes.items) {
          const div = document.createElement("div");
          div.className = `turn ${t.role}`;
          div.innerHTML = `<div class="role"></div><div class="body"></div>`;
          div.querySelector(".role").textContent = t.role;
          div.querySelector(".body").textContent = t.text;
          transcript.appendChild(div);
        }
      }

      const bp = document.createElement("div");
      bp.className = "blueprint-view";
      const bpHeading = document.createElement("h3");
      bpHeading.textContent = "💎 Blueprint";
      root.appendChild(bpHeading);
      root.appendChild(bp);
      if (blueprintRes.error) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No blueprint yet. Hit ingest-fake below.";
        bp.appendChild(empty);
      } else {
        const pre = document.createElement("pre");
        pre.textContent = blueprintRes.markdown;
        bp.appendChild(pre);
        const copyBtn = document.createElement("button");
        copyBtn.className = "btn";
        copyBtn.textContent = "📋 Copy markdown";
        copyBtn.addEventListener("click", () => navigator.clipboard.writeText(blueprintRes.markdown));
        bp.appendChild(copyBtn);
      }

      const actions = document.createElement("div");
      actions.className = "row-actions";
      const ingestBtn = document.createElement("button");
      ingestBtn.className = "btn primary";
      ingestBtn.textContent = "✨ Ingest fake turn";
      ingestBtn.addEventListener("click", async () => {
        try {
          await api(API.ingestFake(state.selectedId), { method: "POST" });
          await selectDump(state.selectedId);
          await loadDumps();
          showToast("Blueprint generated");
        } catch (e) { showToast(`Ingest failed: ${e.message}`); }
      });
      const delBtn = document.createElement("button");
      delBtn.className = "btn";
      delBtn.textContent = "🗑 Delete";
      delBtn.addEventListener("click", async () => {
        if (!confirm("Delete this dump?")) return;
        try {
          await api(API.dump(state.selectedId), { method: "DELETE" });
          state.selectedId = null;
          $("#dumpDetail").className = "empty";
          $("#dumpDetail").textContent = "Pick a dump to see transcript + blueprint.";
          await loadDumps();
          showToast("Dump deleted");
        } catch (e) { showToast(`Delete failed: ${e.message}`); }
      });
      actions.append(ingestBtn, delBtn);
      root.appendChild(actions);
    }

    async function loadProviders() {
      const data = await api(API.providers);
      const list = $("#healthList");
      const nav = $("#navHealth");
      list.innerHTML = "";
      if (!data.health || data.health.length === 0) {
        nav.textContent = "No providers yet";
        return;
      }
      nav.textContent = `${data.health.length} providers loaded`;
      for (const h of data.health) {
        const row = document.createElement("div");
        row.className = "health-row";
        row.dataset.ok = String(h.ok);
        row.innerHTML = `<span class="health-dot"></span><span class="name"></span><span class="detail"></span>`;
        row.querySelector(".name").textContent = h.name;
        row.querySelector(".detail").textContent = h.detail || "";
        list.appendChild(row);
      }
    }

    async function runSearch(q) {
      if (!q) return;
      try {
        const data = await api(`${API.search}?q=${encodeURIComponent(q)}`);
        const list = $("#dumpList");
        list.innerHTML = "";
        const heading = document.createElement("h2");
        heading.textContent = `🔍 ${data.results.length} matches`;
        heading.style.margin = "0 0 12px";
        heading.style.fontSize = "0.9rem";
        list.appendChild(heading);
        for (const r of data.results) {
          const btn = document.createElement("button");
          btn.className = "dump-item";
          btn.type = "button";
          btn.innerHTML = `<div class="title"></div><div class="meta"><span class="badge"></span></div>`;
          btn.querySelector(".title").textContent = `${r.title} · dump #${r.dump_id}`;
          btn.querySelector(".badge").textContent = `score ${r.score.toFixed(2)}`;
          btn.addEventListener("click", () => selectDump(r.dump_id));
          list.appendChild(btn);
        }
      } catch (e) { showToast(`Search failed: ${e.message}`); }
    }

    function openDrawer(el) {
      $("#scrim").classList.add("is-open");
      el.classList.add("is-open");
    }
    function closeDrawers() {
      $("#scrim").classList.remove("is-open");
      $$(".drawer").forEach((d) => d.classList.remove("is-open"));
    }

    function connectSSE() {
      if (state.busSource) state.busSource.close();
      const es = new EventSource(API.events);
      state.busSource = es;
      es.addEventListener("dump.created", (e) => {
        const data = JSON.parse(e.data).payload;
        showToast(`New dump #${data.dump_id}: ${data.title}`);
        loadDumps();
      });
      es.addEventListener("dump.deleted", () => { loadDumps(); });
      es.addEventListener("blueprint.generated", (e) => {
        const data = JSON.parse(e.data).payload;
        showToast(`Blueprint ready for #${data.dump_id}`);
        if (data.dump_id === state.selectedId) selectDump(data.dump_id);
      });
      es.addEventListener("provider.updated", (e) => {
        const data = JSON.parse(e.data).payload;
        showToast(`Provider ${data.name} saved`);
        loadProviders();
      });
      es.onerror = () => { setTimeout(connectSSE, 3000); };
    }

    function bindEvents() {
      $("#menuBtn").addEventListener("click", () => openDrawer($("#drawer")));
      $("#settingsBtn").addEventListener("click", () => openDrawer($("#settingsDrawer")));
      $("#navSettingsBtn").addEventListener("click", () => openDrawer($("#settingsDrawer")));
      $("#navSearchBtn").addEventListener("click", () => $("#searchInput").focus());
      $("#scrim").addEventListener("click", closeDrawers);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDrawers();
      });

      $("#searchInput").addEventListener("input", (e) => {
        const q = e.target.value.trim();
        if (q.length >= 2) runSearch(q);
        else if (q === "") loadDumps();
      });

      $("#newDumpForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = $("#newTitle").value.trim();
        const audio_path = $("#newAudio").value.trim() || null;
        if (!title) return;
        try {
          const dump = await api(API.dumps, { method: "POST", body: JSON.stringify({ title, audio_path }) });
          setMascotState("listening");
          await loadDumps();
          selectDump(dump.id);
          $("#newDumpForm").reset();
          showToast(`Created dump #${dump.id}`);
        } catch (err) { showToast(`Create failed: ${err.message}`); }
      });

      $("#providerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = $("#provName").value.trim();
        const kind = $("#provKind").value;
        const enabled = $("#provEnabled").checked;
        let config = {};
        const raw = $("#provConfig").value.trim();
        if (raw) {
          try { config = JSON.parse(raw); }
          catch { return showToast("Config must be valid JSON"); }
        }
        try {
          await api(API.providers, { method: "POST", body: JSON.stringify({ name, kind, enabled, config }) });
          $("#providerForm").reset();
          showToast(`Provider ${name} saved`);
        } catch (err) { showToast(`Save failed: ${err.message}`); }
      });

      const recBtn = $("#recordBtn");
      recBtn.addEventListener("click", async () => {
        if (!state.selectedId) return showToast("Select or create a dump first");
        state.recording = !state.recording;
        recBtn.classList.toggle("is-recording", state.recording);
        const status = state.recording ? "listening" : "idle";
        try {
          await api(API.status(state.selectedId), { method: "PATCH", body: JSON.stringify({ status }) });
          setMascotState(status);
        } catch (err) { showToast(`Status update failed: ${err.message}`); }
      });
    }

    async function init() {
      bindEvents();
      try {
        await loadDumps();
        await loadProviders();
        setMascotState("idle");
        connectSSE();
      } catch (e) {
        showToast(`Init failed: ${e.message}`);
      }
    }
    init();
  </script>
</body>
</html>
