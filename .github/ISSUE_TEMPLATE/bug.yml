name: "🐛 Bug Report"
description: "Something is broken."
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! 🐛
        Please fill in the sections below so we can reproduce and fix it quickly.
  - type: textarea
    id: describe
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "vibedump crashes when I try to dump a screen on my Pi 5"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "List the exact steps that trigger the bug."
      placeholder: |
        1. Run `vibedump dump --provider openai`
        2. Wait for the splash screen
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen?"
      placeholder: "The screen should dump successfully and save to ~/Pictures/vibedump/"
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "What actually happened? Include error messages if any."
      placeholder: "Got a `KeyError: 'model'` and the process exited with code 1."
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Details about your setup."
      placeholder: |
        - **OS:** Raspberry Pi OS Bookworm 64-bit
        - **Python version:** 3.11.2
        - **Pi model:** Pi 5
        - **Provider:** openai (gpt-4o)
        - **Version / commit SHA:** v0.4.1 / abc1234
  - type: dropdown
    id: hardware
    attributes:
      label: "Hardware"
      description: "What device are you running on?"
      options:
        - "Pi Zero 2 W + Whisplay"
        - "Pi 5 + Whisplay"
        - "Linux desktop"
        - "macOS"
        - "Windows"
        - "none"
    validations:
      required: true
  - type: checkboxes
    id: attachments
    attributes:
      label: "Logs / screenshots"
      description: "Help us debug faster by attaching supporting material."
      options:
        - label: "I will attach log files (paste below or drag into the issue)"
        - label: "I will attach screenshots"
        - label: "I have included a minimal reproducer (if possible)"
